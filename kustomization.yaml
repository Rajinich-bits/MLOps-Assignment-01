apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: mlops

resources:
  - deployment/minikube-stack.yaml

configMapGenerator:
  - name: prometheus-config
    files:
      - prometheus.yml=monitoring/prometheus-minikube.yml
  - name: grafana-datasource
    files:
      - prometheus.yml=monitoring/grafana/provisioning/datasources/prometheus.yml
  - name: grafana-dashboard-provider
    files:
      - dashboards.yml=monitoring/grafana/provisioning/dashboards/dashboards.yml
  - name: grafana-dashboard
    files:
      - heart-api.json=monitoring/grafana/dashboards/heart-api.json
